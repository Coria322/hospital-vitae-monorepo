info:
  name: 03 - Acceso Medico a Auditoria (403 Forbidden)
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/auditoria"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{medico_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Médico no autorizado a consultar bitácora retorna 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
          expect(res.getBody().status).to.equal("error");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
