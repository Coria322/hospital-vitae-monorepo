info:
  name: 02 - Consulta con Filtros (200 OK)
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/auditoria?resultado=EXITOSO&per_page=10"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
  params:
    - name: resultado
      value: EXITOSO
      type: query
    - name: per_page
      value: "10"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("Filtros de consulta de auditoría retornan 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data.per_page).to.equal(10);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
