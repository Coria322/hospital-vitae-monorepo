info:
  name: 01 - Acceso Sin Token (401)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/usuarios"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("Acceso sin token retorna 401 Unauthorized", function() {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
