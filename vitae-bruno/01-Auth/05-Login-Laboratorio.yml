info:
  name: 05 - Login Laboratorio
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id_usuario": "LAB-001",
        "password": "password123"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Login laboratorio exitoso con 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Rol asignado es LABORATORISTA", function() {
          expect(res.getBody().data.usuario.rol).to.equal('LABORATORISTA');
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: laboratorio_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
