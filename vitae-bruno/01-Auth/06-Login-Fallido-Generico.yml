info:
  name: 06 - Login Fallido (Generico 401)
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id_usuario": "ADM-001",
        "password": "password_incorrecto"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Credenciales invalidas retorna 401", function() {
          expect(res.getStatus()).to.equal(401);
        });
        test("Mensaje generico contra enumeracion", function() {
          expect(res.getBody().message).to.equal('Credenciales inválidas.');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
