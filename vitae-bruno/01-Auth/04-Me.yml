info:
  name: 04 - Consultar Perfil Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/auth/me"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Consulta de perfil me retorna 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.id_usuario).to.equal('ADM-001');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
