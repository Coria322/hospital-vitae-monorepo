info:
  name: 05 - Renovar Token (Refresh)
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Refresh token exitoso retorna 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.token).to.be.a('string');
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: admin_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
