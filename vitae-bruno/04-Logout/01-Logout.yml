info:
  name: 01 - Cerrar Sesion (Logout)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Logout revoca token con 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
