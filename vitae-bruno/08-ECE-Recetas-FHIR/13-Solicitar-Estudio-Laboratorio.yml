info:
  name: 13 - Solicitar Estudio de Laboratorio (201 Created)
  type: http
  seq: 13

http:
  method: POST
  url: "{{base_url}}/solicitudes-estudio"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{medico_token}}"
  body:
    type: json
    data: |-
      {
        "id_expediente": "{{expediente_id}}",
        "tipo_estudio": "QUIMICA_CLINICA_6_ELEMENTOS",
        "prioridad": "NORMAL",
        "indicaciones_clinicas": "Ayuno de 8 horas, determinar glucosa, urea, creatinina y ácido úrico."
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Solicitud de laboratorio vinculada exitosamente al expediente", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data.estado).to.equal("PENDIENTE");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id_solicitud
        method: jsonq
      variable:
        name: solicitud_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
