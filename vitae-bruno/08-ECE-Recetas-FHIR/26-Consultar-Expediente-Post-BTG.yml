info:
  name: 26 - Consultar Expediente Clínico con Pase BTG (200 OK)
  type: http
  seq: 26

http:
  method: GET
  url: "{{base_url}}/expedientes-clinicos/{{expediente_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{medico2_token}}"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Acceso clínico concedido tras validación de pase de emergencia Break-the-Glass", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
