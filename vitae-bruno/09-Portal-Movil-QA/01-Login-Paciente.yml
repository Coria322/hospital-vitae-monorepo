info:
  name: 01 - Login Paciente (200 OK)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id_usuario": "PAC-001",
        "password": "password123"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Paciente inicia sesión exitosamente en el sistema", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data.usuario.rol).to.equal("PACIENTE");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: paciente_token
        scope: runtime

