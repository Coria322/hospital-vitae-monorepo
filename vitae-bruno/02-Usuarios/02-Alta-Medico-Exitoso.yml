info:
  name: 02 - Alta Medico (Exitoso 201)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/usuarios"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}
  body:
    type: json
    data: |-
      {
        "id_usuario": "MED-002",
        "nombre_completo": "Dra. Sofia Navarro",
        "rol": "MEDICO",
        "cedula": "7896541230",
        "password": "password123"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Alta valida de medico retorna 201 o 422 si ya existe", function() {
          expect([201, 422]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
