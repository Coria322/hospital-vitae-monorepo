info:
  name: 01 - Listar Usuarios (Paginado)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/usuarios"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{admin_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Listado de usuarios retorna 200 paginado", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
