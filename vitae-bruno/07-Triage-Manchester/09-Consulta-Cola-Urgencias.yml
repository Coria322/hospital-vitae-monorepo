http:
  method: GET
  url: "{{base_url}}/triages/cola"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{medico_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna cola de urgencias viva ordenada por prioridad y SLA", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
