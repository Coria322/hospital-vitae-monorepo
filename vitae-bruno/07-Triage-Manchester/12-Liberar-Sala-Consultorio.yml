info:
  name: 12 - Liberación de Sala o Consultorio (200 OK)
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/salas/CONS-01/liberar"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{medico_token}}

runtime:
  scripts:
    - type: tests
      code: |-
        test("Médico libera consultorio con éxito y llama al siguiente paciente", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data.sala_liberada).to.equal("CONS-01");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
