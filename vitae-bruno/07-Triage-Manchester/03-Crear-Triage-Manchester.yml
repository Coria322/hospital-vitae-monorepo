info:
  name: 03 - Crear Triage Manchester - Estable (201 Created)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/triages"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{enfermera_token}}
  body:
    type: json
    data: |-
      {
        "id_paciente": "{{paciente_id}}",
        "presion_art": "120/80",
        "frecuencia_card": 78,
        "frecuencia_resp": 16,
        "temperatura": 36.6,
        "spo2": 98,
        "nivel_glucosa": 92,
        "escala_eva": 1,
        "nivel_conciencia": "ALERTA"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Crea triage exitosamente con 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().status).to.equal("success");
          expect(res.getBody().data.triage.color_asig).to.equal("AZUL");
          expect(res.getBody().data.triage.sla_vencido).to.equal(false);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.triage.id_triage
        method: jsonq
      variable:
        name: triage_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
